name: Mirsa Android lab
run-name: Android Lab ${{ inputs.job_ref }}
on:
  workflow_dispatch:
    inputs:
      job_ref:
        description: Immutable public job commit SHA
        required: true
        type: string
permissions:
  contents: read
jobs:
  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate job
        env:
          JOB_REF: ${{ inputs.job_ref }}
        run: |
          [[ "$JOB_REF" =~ ^[0-9a-f]{40}$ ]] || exit 1
          mkdir -p out
          echo '{"schema":1,"status":"fail","platform":"android","scope":"emulator-only","error":"emulator setup or boot failed before test"}' > out/result.json
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.job_ref }}
          path: input
          persist-credentials: false
      - name: Enable and require KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          sudo chmod 666 /dev/kvm
          ls -l /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          disable-linux-hw-accel: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -accel on
          script: python3 scripts/android.py input/job
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab-results
          path: out/
          if-no-files-found: error
          retention-days: 7
